<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#a9ca83" />
  <meta name="description" content="A little birthday garden to wander through." />
  <title>Birthday Garden</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="collectibles.css" />
</head>

<body>
  <main class="full-garden" aria-label="Birthday garden">
    <div class="viewport" id="viewport">
      <canvas id="garden"
        aria-label="A garden you can explore. Use the arrow keys or direction buttons to walk."></canvas>
      <div id="welcome-screen" class="welcome-screen" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
        <section class="welcome-card">
          <span class="welcome-flower welcome-flower-one" aria-hidden="true">✿</span>
          <span class="welcome-flower welcome-flower-two" aria-hidden="true">✿</span>
          <p class="welcome-kicker">A LITTLE GARDEN FOR YOU</p>
          <h1 id="welcome-title">Your garden is waiting</h1>
          <p class="welcome-copy">Wander through a sunny little world, meet its lovely creatures, and discover the surprises tucked inside.</p>
          <div class="welcome-actions">
            <button id="welcome-explore" class="welcome-primary" type="button">Explore</button>
            <button id="welcome-continue" class="welcome-primary" type="button" hidden>Continue</button>
            <button id="welcome-restart" class="welcome-secondary" type="button" hidden>Explore from scratch</button>
          </div>
          <p class="welcome-footnote"><span aria-hidden="true">♡</span> Take your time and enjoy the little things</p>
        </section>
      </div>
      <div id="item-prompt" class="item-prompt" hidden>
        <p><span class="prompt-emoji">✨</span> You found a <strong id="found-item-name"></strong>!<br />Would you like to collect?</p>
        <button id="collect-item" type="button">Collect</button>
      </div>
      <button id="collection-toggle" class="collection-toggle" type="button" hidden aria-label="Open your collection">
        <span aria-hidden="true">🎁</span> Collection <span id="collection-count" class="collection-count"></span>
      </button>
      <div id="surprise-modal" class="surprise-modal" hidden>
        <section class="surprise-card" role="dialog" aria-modal="true" aria-label="Collected birthday wish">
          <div id="surprise-content"></div>
          <button id="confirm-surprise" class="modal-ok" type="button">OK</button>
        </section>
      </div>
      <div class="controls" aria-label="Movement controls">
        <button class="move up" data-dir="up" aria-label="Walk up">&uarr;</button>
        <button class="move left" data-dir="left" aria-label="Walk left">&larr;</button>
        <button class="move down" data-dir="down" aria-label="Walk down">&darr;</button>
        <button class="move right" data-dir="right" aria-label="Walk right">&rarr;</button>
      </div>
    </div>
  </main>
  <script src="garden.js"></script>
</body>

</html>
